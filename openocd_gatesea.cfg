# please use >= 2022.08 openocd
# some commands are changed to match latest openocd changes
if { [ info exists ADAPTER_SPEED ] } {
    adapter speed $ADAPTER_SPEED
} else {
    adapter speed 4000
}

adapter driver jlinkdll
if { [ info exists JLINK_DLL_PATH ] } {
    jlinkdll path $JLINK_DLL_PATH
} else {
    jlinkdll path "C:/Program Files/SEGGER/JLink_V944/JLink_x64.dll"
}

## Defaults match the current SEGGER J-Link GDB Server setup.
## Override these with -c "set JLINK_DEVICE <device-name>", etc.
if { ![ info exists JLINK_DEVICE ] } {
    set JLINK_DEVICE N205
}
jlinkdll device $JLINK_DEVICE

if { ![ info exists JLINK_CJTAG_INIT_MODE ] } {
    set JLINK_CJTAG_INIT_MODE 1
}
jlinkdll exec "SetcJTAGInitMode = $JLINK_CJTAG_INIT_MODE"

if { ![ info exists JLINKDLL_CONNECT ] } {
    set JLINKDLL_CONNECT on
}
jlinkdll connect $JLINKDLL_CONNECT

# Use the SEGGER DLL cJTAG path by default. Override with:
#   set TRANSPORT jtag
# before sourcing this file if standard JTAG is required.
if { [ info exists TRANSPORT ] } {
    transport select $TRANSPORT
} else {
    transport select cjtag
}

## bindto 0.0.0.0 can be used to cover all available interfaces.
## Uncomment bindto line to enable remote machine debug
# bindto 0.0.0.0

## you can also specify adapter serial to select a J-Link probe
# adapter serial "123456789"

## Bind JTAG with specified serial number passed by JTAGSN
# https://doc.nucleisys.com/nuclei_sdk/develop/buildsystem.html#jtagsn
if { [ info exists JTAGSN ] } {
    puts "Bind JTAG with serial number $JTAGSN"
    adapter serial $JTAGSN
}

# openocd variable set
if { [ info exists BOOT_HARTID ] } {
    puts "boot hart id expected to be $BOOT_HARTID"
    set BOOTHART $BOOT_HARTID
} else {
    puts "Set boot hart id to default 0"
    set BOOTHART 0
}

if { [ info exists SMP ] } {
    puts "SMP CPU count expected to be $SMP"
    set CORECNT $SMP
} else {
    puts "Set default SMP CPU count to default 1"
    set CORECNT 1
}

if { ![ info exists GDB_MAX_CONNECTIONS ] } {
    set GDB_MAX_CONNECTIONS -1
}

# TODO: variables should be replaced by nuclei_gen
if { ![ info exists workmem_base ] } {
    set workmem_base 0x10000000
}
if { ![ info exists workmem_size ] } {
    set workmem_size 0x100000
}
if { ![ info exists flashxip_base ] } {
    set flashxip_base 0x13000000
}
if { ![ info exists xipnuspi_base ] } {
    set xipnuspi_base 0x10014000
}
if { ![ info exists GATESEA_QSPI_BASE ] } {
    set GATESEA_QSPI_BASE 0x40090000
}
if { ![ info exists GATESEA_QSPI_LOADER ] } {
    set GATESEA_QSPI_LOADER builtin:gatesea_qspi
}
if { ![ info exists FLASH_SIZE ] } {
    set FLASH_SIZE 0x1000000
}
if { ![ info exists FLASH_SECTOR_SIZE ] } {
    set FLASH_SECTOR_SIZE 0x1000
}
if { ![ info exists FLASH_DRIVER ] } {
    set FLASH_DRIVER gatesea_qspi
}

# Flash probing is enabled by default for Gatesea QSPI programming.
# Use -c "set NOFLASH 1" before sourcing this file to disable the flash bank.
#
# Default flash path uses the built-in gatesea_qspi openflashloader RAM
# algorithm through the OpenOCD custom driver:
#   flash bank $_FLASHNAME custom $flashxip_base $FLASH_SIZE 0 0 \
#       $_BOOTHARTNAME $GATESEA_QSPI_BASE $GATESEA_QSPI_LOADER \
#       sectorsize=$FLASH_SECTOR_SIZE
#
# Override examples:
#   set GATESEA_QSPI_LOADER {F:/VsCode/openflashloader/build/rv32/loader.bin}
#   set GATESEA_QSPI_BASE 0x40090000
#   set FLASH_SIZE 0x1000000
#   set FLASH_SECTOR_SIZE 0x1000
#
# Legacy NUSPI path is still available:
#   set FLASH_DRIVER nuspi
#   set xipnuspi_base 0x10014000
if { ![ info exists NOFLASH ] } {
    set NOFLASH 0
}
set _noflash $NOFLASH

# Create JTAG chain
set _CHIPNAME riscv
if { [ info exists SPLITMODE ] } {
    # SPLIT MODE mainly for Nuclei NA product line
    # It can split the lock-step CPU into two standalone CPU core
    if { $SPLITMODE > 1 } { # when SPLITMODE > 1, it means you wan to expose two harts for gdb connections
        jtag newtap $_CHIPNAME.1 cpu -irlen 5
        jtag newtap $_CHIPNAME.0 cpu -irlen 5
        set _TARGETNAME $_CHIPNAME.1.cpu
    } else {
        # hart1 hart0 in split mode
        # only one hart will be exposed to be connnected via gdb
        # the hart is selected by BOOTHART
        if { $BOOTHART == 0 } {
            jtag newtap $_CHIPNAME.split cpu -irlen 5
            jtag newtap $_CHIPNAME cpu -irlen 5
        } else {
            jtag newtap $_CHIPNAME cpu -irlen 5
            jtag newtap $_CHIPNAME.split cpu -irlen 5
        }
        set _TARGETNAME $_CHIPNAME.cpu
    }
} else {
    jtag newtap $_CHIPNAME cpu -irlen 5
    set _TARGETNAME $_CHIPNAME.cpu
}

set _smp_command ""

if { $CORECNT > 1 } {
    set _BOOTHARTNAME $_TARGETNAME.$BOOTHART
    for { set _core 0 } { $_core < $CORECNT } { incr _core } {
        set _command "target create $_TARGETNAME.$_core riscv -chain-position $_TARGETNAME"
        if { $_core == 0 } {
            set _command "$_command -rtos hwthread"
            set _smp_command "target smp $_TARGETNAME.$_core"
        } else {
            set _command "$_command -coreid $_core"
            set _smp_command "$_smp_command $_TARGETNAME.$_core"
        }
        # do target create for each cpu
        eval $_command
    }
    # do target smp for all cpus
    eval $_smp_command
} else {
    set _BOOTHARTNAME $_TARGETNAME
    if { [ info exists SPLITMODE ] } {
        if { $SPLITMODE > 1 } {
            target create $_CHIPNAME.0.cpu riscv -chain-position $_CHIPNAME.0.cpu
            target create $_CHIPNAME.1.cpu riscv -chain-position $_CHIPNAME.1.cpu
        } else {
            # split mode coreid is always 0
            target create $_TARGETNAME riscv -chain-position $_TARGETNAME
        }
    } else {
        # create a single hart target with coreid = $BOOTHART
        target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid $BOOTHART
    }
}

foreach _TARGET [target names] {
    $_TARGET configure -gdb-max-connections $GDB_MAX_CONNECTIONS
}

$_BOOTHARTNAME configure -work-area-phys $workmem_base -work-area-size $workmem_size -work-area-backup 1

# VSCode Live Watch needs memory access while the core is running. Prefer
# RISC-V System Bus Access (SBA/sysbus), then fall back to halted-core methods.
if { [ info exists RISCV_MEM_ACCESS ] } {
    eval [concat riscv set_mem_access $RISCV_MEM_ACCESS]
} else {
    riscv set_mem_access sysbus progbuf abstract
}

if { $_noflash == 0 } {
    set _FLASHNAME $_CHIPNAME.flash
    if { [string compare -nocase $FLASH_DRIVER "nuspi"] == 0 } {
        flash bank $_FLASHNAME nuspi $flashxip_base 0 0 0 $_BOOTHARTNAME $xipnuspi_base
    } else {
        flash bank $_FLASHNAME custom $flashxip_base $FLASH_SIZE 0 0 $_BOOTHARTNAME \
            $GATESEA_QSPI_BASE $GATESEA_QSPI_LOADER sectorsize=$FLASH_SECTOR_SIZE
    }
}

# Limit the CSR list reported to GDB/register windows. CSRs outside this list
# are still readable explicitly, for example from GDB:
#   monitor reg csr775
#
# RISCV_GDB_REPORT_CSRS accepts CSR names, CSR addresses, or ranges. The
# default below is written by name:
#   mcause=0x342, mdcause=0x7c9, mtval=0x343, mepc=0x341
#
# Equivalent address-based configuration:
#   set RISCV_GDB_REPORT_CSRS "0x342,0x7c9,0x343,0x341"
#
# Mixed names, addresses, and ranges are also valid, for example:
#   set RISCV_GDB_REPORT_CSRS "mcause,0x7c9,0x340-0x345"
if { ![ info exists RISCV_GDB_REPORT_CSRS ] } {
    set RISCV_GDB_REPORT_CSRS "mcause,mdcause,mtval,mepc,mstatus,mtvec,mie,mip,mscratch"
}
riscv gdb_report_csrs $RISCV_GDB_REPORT_CSRS

init

if { [ info exists pulse_srst ] } {
  adapter assert srst
  adapter deassert srst
}

halt

# We must turn on this because otherwise the IDE version debug cannot download the program into flash
if { $_noflash == 0 } {
    flash protect 0 0 last off
}

arm semihosting enable


#halt
#flash probe 0
#flash write_image erase F:/path/to/app.elf
#verify_image F:/path/to/app.elf
#reset run
